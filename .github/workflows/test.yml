name: FFSKILL Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m py_compile tools/analyze_corpus.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Analyze synthetic example
        run: |
          mkdir -p reports
          python tools/analyze_corpus.py data/weekly_corpus.example.jsonl \
            --json-out reports/example-analysis.json \
            --md-out reports/example-analysis.md
          test -s reports/example-analysis.json
          test -s reports/example-analysis.md
